@if (isLoading()) {
<div class="spinner-container">
    <mat-spinner diameter="50"></mat-spinner>
    <p>Cargando datos...</p>
</div>
} @else {
<div class="profile-container">
    <mat-card class="user-card">
        <mat-card-header>
            <mat-card-title>Información de la cuenta</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <div class="info-row">
                <strong>Nombre:</strong> <span>{{ profile()?.name }}</span>
            </div>
            <div class="info-row">
                <strong>Email:</strong> <span>{{ profile()?.email }}</span>
            </div>
            <div class="info-row">
                <strong>Rol:</strong> <span class="badge">{{ profile()?.role }}</span>
            </div>

            @if(profile()?.role === 'admin') {
            <div class="admin-banner">
                <mat-icon>admin_panel_settings</mat-icon>
                <p>¡Eres un administrador!</p>
            </div>
            }
        </mat-card-content>

        <mat-card-actions>
            @if(profile()?.role === 'admin') {
            <button matButton="filled" (click)="navigateToAdmin()">
                <mat-icon>dashboard</mat-icon>
                Dashboard
            </button>
            }
            <button matButton="filled" color="warn" (click)="signOut()">
                <mat-icon>logout</mat-icon>
                Cerrar Sesión
            </button>
        </mat-card-actions>
    </mat-card>
</div>
}
