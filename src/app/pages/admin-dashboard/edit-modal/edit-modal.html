<h2 mat-dialog-title>Editar vinilo</h2>
<mat-dialog-content [formGroup]="editVinylForm">
    <mat-form-field>
        <mat-label>Título del vinilo</mat-label>
        <input matInput formControlName="title" />
    </mat-form-field>

    <mat-form-field>
        <mat-label>Artista</mat-label>
        <input matInput formControlName="artist" />
    </mat-form-field>

    <mat-form-field>
        <mat-label>Imagen del vinilo</mat-label>
        <input matInput formControlName="image_url" />
    </mat-form-field>

    <mat-form-field>
        <mat-label>Descripción</mat-label>
        <input matInput formControlName="description" />
    </mat-form-field>

    <mat-form-field>
        <mat-label>Precio</mat-label>
        <input matInput type="number" formControlName="price" />
    </mat-form-field>
    <mat-form-field>
        <mat-label>Género</mat-label>
        <mat-select placeholder="Género" formControlName="genre_id">
            <mat-option value="1">Rock</mat-option>
            <mat-option value="2">Jazz</mat-option>
            <mat-option value="3">Pop</mat-option>
            <mat-option value="4">Hiphop</mat-option>
            <mat-option value="5">Electrónica</mat-option>
        </mat-select>
    </mat-form-field>


    <mat-form-field>
        <mat-label>Stock</mat-label>
        <input matInput type="number" formControlName="stock" />
    </mat-form-field>

</mat-dialog-content>
<mat-dialog-actions>
    <button matButton (click)="onNoClick()">Cancelar</button>
    <button matButton [mat-dialog-close]="editVinylForm.value" [disabled]="editVinylForm.invalid">Editar</button>
</mat-dialog-actions>
