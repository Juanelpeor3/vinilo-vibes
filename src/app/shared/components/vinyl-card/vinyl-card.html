<mat-card [routerLink]="['/collections/vinyls', vinyl().id]">
    <img mat-card-image [src]="vinyl().image_url" [alt]="vinyl().title">

    <mat-card-header>
        <mat-card-title>{{ vinyl().title }}</mat-card-title>
        <mat-card-subtitle>{{ vinyl().artist }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
        <h3 class="price">{{ vinyl().price }} €</h3>
    </mat-card-content>
</mat-card>
